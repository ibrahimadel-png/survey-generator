<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survey Generator — L&D Evaluation Toolkit</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #F2F6FB; min-height: 100vh; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .header { background: #1F4E79; padding: 22px 32px 18px; margin-bottom: 28px; }
    .header-label { font-size: 11px; color: #ADD8E6; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px; }
    .header-title { font-size: 22px; font-weight: 700; color: #fff; }
    .header-sub { font-size: 13px; color: #ADD8E6; margin-top: 4px; }
    .container { max-width: 820px; margin: 0 auto; padding: 0 20px 40px; }
    .card { background: #fff; border-radius: 12px; border: 1.5px solid #D6E4F0; padding: 24px 28px; margin-bottom: 24px; }
    .card-title { font-weight: 700; color: #1F4E79; font-size: 16px; margin-bottom: 18px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 13px; color: #1F4E79; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 9px 12px; border-radius: 7px; border: 1.5px solid #D6E4F0; font-size: 14px; color: #1A1A2E; background: #F8FBFF; outline: none; font-family: Arial, sans-serif; }
    textarea { resize: vertical; line-height: 1.6; }
    .field { margin-bottom: 16px; }
    .toggle-wrap { display: flex; border-radius: 8px; overflow: hidden; border: 1.5px solid #D6E4F0; }
    .toggle-btn { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600; background: #F8FBFF; color: #888; border: none; font-family: Arial, sans-serif; transition: all 0.2s; }
    .toggle-btn.active { background: #1F4E79; color: #fff; }
    .toggle-desc { font-size: 11px; color: #888; margin-top: 4px; }
    .upload-area { border: 2px dashed #2E75B6; border-radius: 10px; padding: 18px; text-align: center; cursor: pointer; transition: all 0.2s; background: #F8FBFF; margin-bottom: 10px; }
    .upload-area:hover, .upload-area.dragover { background: #EAF3FB; border-color: #1F4E79; }
    .upload-icon { font-size: 28px; margin-bottom: 6px; }
    .upload-text { font-size: 14px; color: #2E75B6; font-weight: 600; }
    .upload-sub { font-size: 12px; color: #888; margin-top: 3px; }
    .upload-input { display: none; }
    .pdf-status { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 7px; font-size: 13px; margin-bottom: 10px; }
    .pdf-status.reading { background: #EAF3FB; color: #2E75B6; }
    .pdf-status.success { background: #F0FFF4; color: #2D7A47; }
    .pdf-status.error { background: #FFF0F0; color: #c0392b; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 14px 0; }
    .divider-line { flex: 1; height: 1px; background: #e0e0e0; }
    .divider-text { font-size: 12px; color: #888; font-weight: 600; }
    .btn-generate { width: 100%; background: #1F4E79; color: #fff; border: none; border-radius: 8px; padding: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: background 0.2s; font-family: Arial, sans-serif; }
    .btn-generate:hover { background: #2E75B6; }
    .btn-generate:disabled { background: #7FB3D3; cursor: not-allowed; }
    .error-box { background: #FFF0F0; border: 1px solid #ffcccc; border-radius: 7px; padding: 10px 14px; color: #c0392b; font-size: 13px; margin-bottom: 16px; }
    .spinner-wrap { text-align: center; padding: 30px 0; }
    .spinner { width: 36px; height: 36px; border: 4px solid #D6E4F0; border-top-color: #2E75B6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    .spinner-text { color: #2E75B6; font-weight: 600; font-size: 14px; }
    .output-wrap { border-radius: 10px; overflow: hidden; border: 1.5px solid #D6E4F0; }
    .output-header { background: #1F4E79; padding: 16px 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .output-header-label { color: #ADD8E6; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .output-header-title { color: #fff; font-weight: 700; font-size: 15px; margin-top: 2px; }
    .btn-copy { background: #2E75B6; color: #fff; border: none; border-radius: 6px; padding: 8px 18px; font-weight: 700; font-size: 13px; cursor: pointer; transition: background 0.2s; font-family: Arial, sans-serif; white-space: nowrap; flex-shrink: 0; }
    .btn-copy:hover, .btn-copy.copied { background: #70AD47; }
    .output-desc { background: #EAF3FB; padding: 12px 22px; font-size: 13px; color: #595959; line-height: 1.6; font-style: italic; border-bottom: 1.5px solid #D6E4F0; }
    .output-body { background: #F2F6FB; padding: 20px 18px; }
    .stats-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-box { background: #fff; border: 1.5px solid #D6E4F0; border-radius: 8px; padding: 8px 16px; text-align: center; min-width: 90px; }
    .stat-val { font-weight: 700; font-size: 18px; color: #1F4E79; }
    .stat-label { font-size: 11px; color: #595959; }
    .section-block { background: #fff; border: 1.5px solid #D6E4F0; border-radius: 10px; margin-bottom: 18px; overflow: hidden; }
    .section-title-bar { background: #1F4E79; color: #fff; padding: 10px 18px; font-weight: 700; font-size: 15px; }
    .section-body { padding: 14px 18px 10px; }
    .section-desc { color: #595959; font-size: 13px; margin-bottom: 14px; font-style: italic; line-height: 1.6; }
    .question-item { border-bottom: 1px solid #f0f0f0; padding-bottom: 12px; margin-bottom: 12px; display: flex; gap: 10px; align-items: flex-start; }
    .question-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
    .q-num { background: #D6E4F0; color: #1F4E79; border-radius: 5px; font-weight: 700; font-size: 12px; padding: 2px 8px; min-width: 24px; text-align: center; margin-top: 2px; flex-shrink: 0; }
    .q-body { flex: 1; }
    .q-text { font-weight: 600; font-size: 14px; color: #1A1A2E; line-height: 1.5; margin-bottom: 5px; }
    .q-subtext { font-size: 12px; color: #595959; font-style: italic; margin-bottom: 5px; }
    .q-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .tag-type { background: #2E75B6; color: #fff; border-radius: 4px; font-size: 11px; padding: 2px 9px; font-weight: 600; }
    .tag-req { background: #70AD47; color: #fff; border-radius: 4px; font-size: 11px; padding: 2px 9px; font-weight: 600; }
    .tag-opt { background: #f0f0f0; color: #888; border-radius: 4px; font-size: 11px; padding: 2px 9px; font-weight: 600; }
    .q-scale { font-size: 12px; color: #2E75B6; font-weight: 600; margin-top: 4px; }
    .q-options { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .opt-tag { background: #F2F2F2; border: 1px solid #e0e0e0; border-radius: 4px; font-size: 12px; padding: 2px 9px; color: #333; }
    .grid-label { font-size: 12px; color: #595959; font-weight: 600; margin-top: 6px; margin-bottom: 3px; }
    .grid-row { font-size: 12px; color: #333; padding: 2px 0 2px 10px; border-left: 2px solid #D6E4F0; }
    .col-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .col-tag { background: #1F4E79; color: #fff; border-radius: 4px; font-size: 11px; padding: 2px 8px; }
    .length-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-left: 8px; }
    .badge-short { background: #FFF3CD; color: #856404; }
    .badge-detailed { background: #D1ECF1; color: #0C5460; }
  </style>
</head>
<body>
<div class="header">
  <div class="header-label">L&D Evaluation Toolkit</div>
  <div class="header-title">Survey Question Generator</div>
  <div class="header-sub">Kirkpatrick-aligned · Impression & Manager Evaluation</div>
</div>
<div class="container">
  <div class="card">
    <div class="card-title">Course & Survey Details</div>
    <div class="grid-3">
      <div>
        <label>Survey Type *</label>
        <select id="surveyType" onchange="updateLevels()">
          <option>Impression Survey</option>
          <option>Manager Evaluation Survey</option>
        </select>
      </div>
      <div>
        <label>Kirkpatrick Level *</label>
        <select id="level"></select>
      </div>
      <div>
        <label>Survey Length *</label>
        <div class="toggle-wrap">
          <button class="toggle-btn active" id="btnShort" onclick="setLength('short')">⚡ Short</button>
          <button class="toggle-btn" id="btnDetailed" onclick="setLength('detailed')">📋 Detailed</button>
        </div>
        <div class="toggle-desc" id="lengthDesc">5–8 key questions · ~5 min</div>
      </div>
    </div>
    <div class="field">
      <label>Course Name *</label>
      <input type="text" id="courseName" placeholder="e.g. Problem Solving & Decision Making" />
    </div>
    <div class="field">
      <label>Upload Course PDF <span style="color:#888;font-weight:400;">(optional)</span></label>
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('pdfInput').click()" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
        <div class="upload-icon">📄</div>
        <div class="upload-text">Click to upload or drag & drop</div>
        <div class="upload-sub">PDF files only · Content extracted automatically</div>
      </div>
      <input type="file" id="pdfInput" class="upload-input" accept=".pdf" onchange="handleFileSelect(event)" />
      <div id="pdfStatus" style="display:none;"></div>
    </div>
    <div class="divider"><div class="divider-line"></div><div class="divider-text">OR TYPE MANUALLY</div><div class="divider-line"></div></div>
    <div class="field">
      <label>Course Content & Topics</label>
      <textarea id="courseContent" rows="4" placeholder="e.g. 5 Whys, Fishbone Diagram, Decision Matrix, Escalation Matrix..."></textarea>
    </div>
    <div id="errorBox" class="error-box" style="display:none;"></div>
    <button class="btn-generate" id="generateBtn" onclick="generate()">Generate Survey</button>
  </div>
  <div id="spinnerWrap" class="spinner-wrap" style="display:none;">
    <div class="spinner"></div>
    <div class="spinner-text" id="spinnerText">Generating your survey...</div>
  </div>
  <div id="outputWrap" style="display:none;"></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const LEVELS = {
  "Impression Survey": ["Level 1 – Reaction", "Level 2 – Learning"],
  "Manager Evaluation Survey": ["Level 3 – Behavior", "Level 4 – Results", "Level 3 & 4 – Full Evaluation"]
};
let currentLength = "short";

function updateLevels() {
  const type = document.getElementById("surveyType").value;
  const sel = document.getElementById("level");
  sel.innerHTML = "";
  LEVELS[type].forEach(function(l) { const o = document.createElement("option"); o.value = l; o.textContent = l; sel.appendChild(o); });
}
updateLevels();

function setLength(val) {
  currentLength = val;
  document.getElementById("btnShort").classList.toggle("active", val === "short");
  document.getElementById("btnDetailed").classList.toggle("active", val === "detailed");
  document.getElementById("lengthDesc").textContent = val === "short" ? "5–8 key questions · ~5 min" : "12–18 questions · ~12 min · full coverage";
}

function handleDragOver(e) { e.preventDefault(); document.getElementById("uploadArea").classList.add("dragover"); }
function handleDragLeave(e) { document.getElementById("uploadArea").classList.remove("dragover"); }
function handleDrop(e) {
  e.preventDefault(); document.getElementById("uploadArea").classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file && file.type === "application/pdf") processPDF(file);
  else showPDFStatus("error", "Please upload a PDF file only.");
}
function handleFileSelect(e) { if (e.target.files[0]) processPDF(e.target.files[0]); }

async function processPDF(file) {
  showPDFStatus("reading", "Reading PDF...");
  try {
    const ab = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
    let text = "";
    for (let i = 1; i <= Math.min(pdf.numPages, 20); i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(function(x){ return x.str; }).join(" ") + " ";
    }
    text = text.replace(/\s+/g, " ").trim();
    if (text.length < 50) { showPDFStatus("error", "Could not extract text. Please type manually."); return; }
    document.getElementById("courseContent").value = text.substring(0, 3000);
    showPDFStatus("success", "✓ Extracted — " + file.name + " (" + pdf.numPages + " pages)");
  } catch(e) { showPDFStatus("error", "Failed to read PDF. Please type manually."); }
}
function showPDFStatus(type, msg) {
  const el = document.getElementById("pdfStatus");
  el.style.display = "flex"; el.className = "pdf-status " + type; el.textContent = msg;
}

// ── CORE PROMPT WITH EMBEDDED EXAMPLES ──────────────────────────────────────
function buildPrompt(courseName, courseContent, surveyType, level, length) {
  const isShort = length === "short";

  const impressionExamples = `
EXAMPLE — Impression Survey (Reaction) based on real surveys we use:
Sections: Participant Info → Overall Satisfaction (grid: "Overall satisfaction with the course" / "The course met my expectations" / "I would attend another programme") → Content Quality & Relevance (grid: "Materials were well-organized" / "Technology enhanced learning" / "Topics were relevant to my job" / "Scenarios reflected real workplace situations" / "Course addressed skills gaps I face at work" / "Difficulty level was appropriate") → Most Relevant Areas (multi-select) → Skills NOT covered but should be (open-ended) → Trainer Evaluation (grid: "Demonstrated strong subject knowledge" / "Explained concepts clearly" / "Provided constructive feedback" / "Managed time effectively" / "Created positive learning environment" / "Was punctual and prepared") → Skills Improvement (grid per skill area) → Confidence to Apply (separate grid: "Using [skill] in professional settings" / "Applying [tool] accurately") → NPS: "How likely are you to recommend this course?" → Additional comments

KEY PATTERNS to follow:
- Group related questions into Multi Choice Grids with a shared header
- Always separate Skills Improvement from Confidence to Apply — they are different dimensions
- Include a "What was NOT covered" open-ended question
- End with NPS + open comments
- Satisfaction grid must include: overall satisfaction + expectations met + likelihood to attend again
`;

  const managerExamples = `
EXAMPLE — Manager Evaluation Survey (Level 3 & 4) based on real surveys we use:

SECTION: Behavioral Changes
- Frequency of application (Multiple Choice: Never / Rarely / Sometimes / Regularly / Consistently)
- Behavioral grid per competency group (columns: No Improvement / Slight / Moderate / Significant / Exceptional / Cannot Assess)
- Paired questions: rating + "Describe a specific example" (Paragraph, optional)
- Barriers to application (Multiple Choice multi-select: "No opportunity to apply" / "Lack of management support" / "Workload prevented application" / "Tools or resources not available" / "Content not applicable to current role" / "Other")
- Follow-up: "Please describe any other barriers or provide additional context" (Paragraph, optional)
- Overall behavioral change rating + specific example (paired)

SECTION: Results & Business Impact
- Measurable improvement Yes/No/Partially/Cannot Assess → follow-up open-ended
- Business impact grid (1=No impact → 5=High positive impact) per outcome area
- Knowledge transfer: "Has the participant shared knowledge or coached colleagues?" (Multiple Choice)
- ROI rating: 1=Poor no observable value / 2=Below expectations / 3=Met expectations / 4=Above expectations / 5=Excellent strong and clear ROI
- What has NOT been applied yet + what support would enable it (Paragraph, required)
- Most significant positive change with specific example (SAR format hint: Situation / Action / Result)
- Would you recommend this training + explanation (paired)
- Additional support needed (Paragraph, optional)

KEY PATTERNS to follow:
- Always pair a rating question with a follow-up open-ended "describe a specific example"
- Include a barriers question — this is critical for Level 3 diagnosis
- Use SAR format hint in open-ended questions about examples
- ROI rating must have explicit labels for each number
- "What hasn't been applied + why + what support" is always the last required open-ended
- End with recommendation + explanation (paired) then optional additional comments
`;

  const lengthRule = isShort
    ? "SURVEY LENGTH: SHORT — Generate 5 to 8 questions maximum. Pick only the single most diagnostic question per dimension. No nice-to-haves. Be ruthless about what earns its place."
    : "SURVEY LENGTH: DETAILED — Generate 12 to 18 questions. Cover all dimensions thoroughly. Follow the example patterns above closely. Include all paired questions, barriers, SAR hints, ROI rating, and the unapplied content question.";

  return "You are a Senior L&D Evaluation Specialist expert in Kirkpatrick 4-Level Evaluation.\n\n" +
    "Course Name: " + courseName + "\n" +
    "Course Content: " + courseContent.substring(0, 2000) + "\n" +
    "Survey Type: " + surveyType + "\n" +
    "Kirkpatrick Level: " + level + "\n\n" +
    lengthRule + "\n\n" +
    (surveyType === "Impression Survey" ? impressionExamples : managerExamples) + "\n\n" +
    "ADDITIONAL RULES:\n" +
    "- Always Section 1: participant or manager information (Short Answer fields).\n" +
    "- Professional corporate English only.\n" +
    "- All questions must be observable and realistic for the respondent.\n" +
    "- Mark required: true or false for every question.\n" +
    "- For Manager Evaluation: last section title must be 'Results & Business Impact'.\n" +
    "- Adapt all question content specifically to the course topics provided.\n\n" +
    "Return ONLY valid JSON, no markdown, no explanation:\n" +
    '{"formTitle":"...","formDescription":"...","sections":[{"title":"...","description":"...","questions":[{"question":"...","type":"Short Answer|Multiple Choice|Linear Scale|Multiple Choice Grid|Paragraph","required":true,"subtext":null,"options":null,"scale":null,"rows":null,"columns":null}]}]}';
}

async function generate() {
  const courseName = document.getElementById("courseName").value.trim();
  const courseContent = document.getElementById("courseContent").value.trim();
  const surveyType = document.getElementById("surveyType").value;
  const level = document.getElementById("level").value;
  const errorBox = document.getElementById("errorBox");
  const btn = document.getElementById("generateBtn");

  if (!courseName || !courseContent) {
    errorBox.textContent = "Please fill in Course Name and Course Content (or upload a PDF).";
    errorBox.style.display = "block"; return;
  }
  errorBox.style.display = "none";
  btn.disabled = true; btn.textContent = "Generating...";
  document.getElementById("spinnerWrap").style.display = "block";
  document.getElementById("outputWrap").style.display = "none";
  document.getElementById("spinnerText").textContent = currentLength === "short" ? "Generating short survey..." : "Generating detailed survey...";

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 4000,
        messages: [{ role: "user", content: buildPrompt(courseName, courseContent, surveyType, level, currentLength) }]
      })
    });
    const data = await response.json();
    const text = (data.content || []).map(function(c){ return c.text || ""; }).join("");
    const clean = text.replace(/```json/g,"").replace(/```/g,"").trim();
    const survey = JSON.parse(clean);
    renderSurvey(survey, level, currentLength);
  } catch(e) {
    errorBox.textContent = "Something went wrong. Please try again.";
    errorBox.style.display = "block";
  }
  btn.disabled = false; btn.textContent = "Generate Survey";
  document.getElementById("spinnerWrap").style.display = "none";
}

function formatText(survey) {
  let out = survey.formTitle + "\n" + "=".repeat(survey.formTitle.length) + "\n\n";
  if (survey.formDescription) out += survey.formDescription + "\n\n";
  survey.sections.forEach(function(sec) {
    out += "\n-- " + sec.title + " --\n";
    if (sec.description) out += sec.description + "\n\n";
    sec.questions.forEach(function(q, i) {
      out += (i+1) + ". " + q.question + "\n";
      out += "   Type: " + q.type + " | " + (q.required ? "Required" : "Optional") + "\n";
      if (q.subtext) out += "   Note: " + q.subtext + "\n";
      if (q.scale) out += "   Scale: " + q.scale + "\n";
      if (q.options && q.options.length) out += "   Options: " + q.options.join(" / ") + "\n";
      if (q.rows && q.rows.length) {
        out += "   Rows:\n" + q.rows.map(function(r){ return "     - " + r; }).join("\n") + "\n";
        if (q.columns && q.columns.length) out += "   Columns: " + q.columns.join(" / ") + "\n";
      }
      out += "\n";
    });
  });
  return out;
}

function renderSurvey(survey, level, length) {
  const totalQ = survey.sections.reduce(function(a,s){ return a + s.questions.length; }, 0);
  const reqQ = survey.sections.reduce(function(a,s){ return a + s.questions.filter(function(q){ return q.required; }).length; }, 0);
  const badgeClass = length === "short" ? "badge-short" : "badge-detailed";
  const badgeText = length === "short" ? "⚡ Short" : "📋 Detailed";

  let html = '<div class="output-wrap">';
  html += '<div class="output-header"><div style="flex:1;min-width:0;"><div class="output-header-label">Generated Survey</div>';
  html += '<div class="output-header-title">' + esc(survey.formTitle) + '<span class="length-badge ' + badgeClass + '">' + badgeText + '</span></div></div>';
  html += '<button class="btn-copy" id="copyBtn" onclick="copyText()">Copy All as Text</button></div>';
  if (survey.formDescription) html += '<div class="output-desc">' + esc(survey.formDescription) + '</div>';
  html += '<div class="output-body"><div class="stats-row">';
  [{val:survey.sections.length,label:"Sections"},{val:totalQ,label:"Total Questions"},{val:reqQ,label:"Required"},{val:level.split("–")[0].trim(),label:"Kirkpatrick"}]
    .forEach(function(s){ html += '<div class="stat-box"><div class="stat-val">' + esc(String(s.val)) + '</div><div class="stat-label">' + esc(s.label) + '</div></div>'; });
  html += '</div>';

  survey.sections.forEach(function(sec) {
    html += '<div class="section-block"><div class="section-title-bar">' + esc(sec.title) + '</div><div class="section-body">';
    if (sec.description) html += '<div class="section-desc">' + esc(sec.description) + '</div>';
    sec.questions.forEach(function(q, i) {
      html += '<div class="question-item"><span class="q-num">' + (i+1) + '</span><div class="q-body">';
      html += '<div class="q-text">' + esc(q.question) + '</div>';
      if (q.subtext) html += '<div class="q-subtext">' + esc(q.subtext) + '</div>';
      html += '<div class="q-tags"><span class="tag-type">' + esc(q.type) + '</span>';
      html += '<span class="' + (q.required ? 'tag-req' : 'tag-opt') + '">' + (q.required ? 'Required' : 'Optional') + '</span></div>';
      if (q.scale) html += '<div class="q-scale">Scale: ' + esc(q.scale) + '</div>';
      if (q.options && q.options.length) html += '<div class="q-options">' + q.options.map(function(o){ return '<span class="opt-tag">' + esc(o) + '</span>'; }).join('') + '</div>';
      if (q.rows && q.rows.length) {
        html += '<div class="grid-label">Grid Rows:</div>';
        q.rows.forEach(function(r){ html += '<div class="grid-row">• ' + esc(r) + '</div>'; });
        if (q.columns && q.columns.length) {
          html += '<div class="grid-label">Columns:</div><div class="col-tags">';
          q.columns.forEach(function(c){ html += '<span class="col-tag">' + esc(c) + '</span>'; });
          html += '</div>';
        }
      }
      html += '</div></div>';
    });
    html += '</div></div>';
  });

  html += '</div></div>';
  const wrap = document.getElementById("outputWrap");
  wrap.innerHTML = html; wrap.style.display = "block";
  window._surveyText = formatText(survey);
}

function copyText() {
  if (!window._surveyText) return;
  navigator.clipboard.writeText(window._surveyText).then(function() {
    const btn = document.getElementById("copyBtn");
    btn.textContent = "✓ Copied!"; btn.classList.add("copied");
    setTimeout(function(){ btn.textContent = "Copy All as Text"; btn.classList.remove("copied"); }, 2000);
  });
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
